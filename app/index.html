<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Navigator</title>
<style>body{font:16px system-ui;background:#101827;color:#eef2ff;margin:0;padding:24px}main{max-width:900px;margin:auto}section{background:#1d293b;padding:20px;border-radius:14px;margin:16px 0}textarea,input,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #64748b;border-radius:8px;background:#0f172a;color:white;margin:6px 0}button{background:#2563eb;cursor:pointer;border:0}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin-top:10px}</style></head>
<body><main><h1>AI Navigator Support</h1><p>Локальный интерфейс для демонстрации. Не вводите реальные персональные данные.</p>
<section><label>Сервисный токен (хранится только в текущей вкладке)<input id="token" type="password" autocomplete="off"></label></section>
<section><h2>Демонстрационные заявки</h2><button onclick="loadDemo()">Загрузить синтетические заявки</button><pre id="demo"></pre></section>
<section><h2>Анализ заявки через GigaChat</h2><textarea id="description" rows="4" placeholder="Описание синтетической заявки"></textarea><button onclick="submitAnalysis()">Проанализировать</button><pre id="analysis"></pre></section>
<section><h2>Массовые инциденты</h2><p>Введите массив синтетических заявок JSON.</p><textarea id="tickets" rows="7">[{"id":"1","timestamp":"2026-11-02T10:00:00Z","description":"POS offline","region":"Lipetsk","equipment":"POS"},{"id":"2","timestamp":"2026-11-02T10:10:00Z","description":"POS offline","region":"Lipetsk","equipment":"POS"},{"id":"3","timestamp":"2026-11-02T10:20:00Z","description":"POS offline","region":"Lipetsk","equipment":"POS"}]</textarea><button onclick="submitDetection()">Найти массовые сбои</button><pre id="incidents"></pre></section>
<section><h2>Поиск технических инструкций</h2><input id="query" placeholder="Например: POS network"><textarea id="articles" rows="5">[{"id":"pos-network","title":"POS network","content":"Проверьте соединение с сетью и доступность шлюза."}]</textarea><button onclick="submitSearch()">Найти статьи</button><pre id="results"></pre></section></main>
<script>
async function loadDemo(){const output=document.getElementById('demo');try{const response=await fetch('/api/v1/demo/tickets',{headers:{'Authorization':'Bearer '+document.getElementById('token').value}});const data=await response.json();output.textContent=JSON.stringify(data,null,2);if(response.ok){document.getElementById('tickets').value=JSON.stringify(data,null,2)}}catch(e){output.textContent='Ошибка соединения с сервером'}}
async function request(path,body,target){const output=document.getElementById(target);output.textContent='Запрос выполняется...';try{const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+document.getElementById('token').value},body:JSON.stringify(body)});const data=await response.json();output.textContent=JSON.stringify(data,null,2);if(!response.ok)output.textContent='HTTP '+response.status+'\n'+output.textContent}catch(e){output.textContent='Ошибка соединения с сервером'}}
function submitAnalysis(){request('/api/v1/incidents/analyze',{description:document.getElementById('description').value},'analysis')}
function submitDetection(){try{request('/api/v1/incidents/detect',{tickets:JSON.parse(document.getElementById('tickets').value)},'incidents')}catch(e){document.getElementById('incidents').textContent='Неверный JSON'}}
function submitSearch(){try{request('/api/v1/knowledge/search',{query:document.getElementById('query').value,articles:JSON.parse(document.getElementById('articles').value)},'results')}catch(e){document.getElementById('results').textContent='Неверный JSON'}}
</script></body></html>
